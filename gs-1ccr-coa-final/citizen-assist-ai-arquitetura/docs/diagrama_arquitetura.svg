<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc0069"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1000" height="600" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#18233b">Citizen Assist AI — Diagrama de arquitetura</text>

  <!-- Grupo ESP32 -->
  <rect x="20" y="50" width="370" height="320" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="35" y="72" font-size="12" font-weight="bold" fill="#475569">DISPOSITIVO DE BORDA · ESP32 DevKit V1 (Wokwi)</text>

  <rect x="40" y="90" width="150" height="100" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="115" y="112" font-size="13" font-weight="bold" text-anchor="middle" fill="#065f46">ENTRADAS</text>
  <text x="115" y="136" font-size="11" text-anchor="middle" fill="#1f2937">Botão CHEGADA</text>
  <text x="115" y="151" font-size="11" text-anchor="middle" fill="#64748b">GPIO 18 (pull-up)</text>
  <text x="115" y="170" font-size="11" text-anchor="middle" fill="#1f2937">Botão CONCLUSÃO</text>
  <text x="115" y="185" font-size="11" text-anchor="middle" fill="#64748b">GPIO 19 (pull-up)</text>

  <rect x="40" y="210" width="150" height="145" rx="8" fill="#fff7ed" stroke="#f97316"/>
  <text x="115" y="232" font-size="13" font-weight="bold" text-anchor="middle" fill="#9a3412">SAÍDAS</text>
  <text x="115" y="255" font-size="11" text-anchor="middle" fill="#1f2937">Display OLED 128×64</text>
  <text x="115" y="270" font-size="11" text-anchor="middle" fill="#64748b">I²C · GPIO 21/22</text>
  <text x="115" y="292" font-size="11" text-anchor="middle" fill="#1f2937">LED verde · GPIO 25</text>
  <text x="115" y="312" font-size="11" text-anchor="middle" fill="#1f2937">LED vermelho · GPIO 26</text>
  <text x="115" y="332" font-size="11" text-anchor="middle" fill="#1f2937">Buzzer · GPIO 27</text>

  <rect x="225" y="90" width="150" height="265" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="300" y="112" font-size="13" font-weight="bold" text-anchor="middle" fill="#3730a3">ESP32 (CPU)</text>
  <text x="300" y="132" font-size="11" text-anchor="middle" fill="#1f2937">Xtensa LX6 32 bits</text>
  <text x="300" y="147" font-size="11" text-anchor="middle" fill="#1f2937">2 núcleos · até 240 MHz</text>
  <rect x="237" y="160" width="126" height="56" rx="6" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="300" y="179" font-size="11" font-weight="bold" text-anchor="middle" fill="#3730a3">SRAM 520 KB</text>
  <text x="300" y="194" font-size="10" text-anchor="middle" fill="#475569">variáveis, buffers</text>
  <text x="300" y="207" font-size="10" text-anchor="middle" fill="#475569">MQTT/JSON e OLED</text>
  <rect x="237" y="224" width="126" height="44" rx="6" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="300" y="242" font-size="11" font-weight="bold" text-anchor="middle" fill="#3730a3">Flash 4 MB (SPI)</text>
  <text x="300" y="257" font-size="10" text-anchor="middle" fill="#475569">firmware (sketch.ino)</text>
  <rect x="237" y="276" width="126" height="44" rx="6" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="300" y="294" font-size="11" font-weight="bold" text-anchor="middle" fill="#3730a3">Rádio Wi-Fi</text>
  <text x="300" y="309" font-size="10" text-anchor="middle" fill="#475569">802.11 b/g/n · 2,4 GHz</text>
  <text x="300" y="342" font-size="10" text-anchor="middle" fill="#64748b">GPIO · I²C · Wi-Fi integrados</text>

  <line x1="190" y1="140" x2="223" y2="140" stroke="#dc0069" stroke-width="2" marker-end="url(#a)"/>
  <line x1="225" y1="280" x2="192" y2="280" stroke="#dc0069" stroke-width="2" marker-end="url(#a)"/>

  <!-- Rede -->
  <rect x="470" y="140" width="170" height="120" rx="10" fill="#fdf2f8" stroke="#db2777"/>
  <text x="555" y="164" font-size="13" font-weight="bold" text-anchor="middle" fill="#9d174d">BROKER MQTT</text>
  <text x="555" y="186" font-size="11" text-anchor="middle" fill="#1f2937">broker.hivemq.com</text>
  <text x="555" y="202" font-size="11" text-anchor="middle" fill="#64748b">TCP 1883 (sem TLS)</text>
  <text x="555" y="224" font-size="10" text-anchor="middle" fill="#475569">…/events (ESP32 → API)</text>
  <text x="555" y="240" font-size="10" text-anchor="middle" fill="#475569">…/state (API → ESP32)</text>
  <text x="555" y="125" font-size="11" font-weight="bold" text-anchor="middle" fill="#9d174d">Internet</text>

  <line x1="377" y1="180" x2="467" y2="180" stroke="#dc0069" stroke-width="2" marker-end="url(#a)"/>
  <text x="422" y="172" font-size="10" text-anchor="middle" fill="#475569">eventos JSON</text>
  <line x1="468" y1="225" x2="379" y2="225" stroke="#dc0069" stroke-width="2" marker-end="url(#a)"/>
  <text x="422" y="243" font-size="10" text-anchor="middle" fill="#475569">estado da fila</text>
  <text x="422" y="203" font-size="9" text-anchor="middle" fill="#64748b">Wi-Fi + MQTT</text>

  <!-- Servidor -->
  <rect x="730" y="50" width="250" height="320" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="745" y="72" font-size="12" font-weight="bold" fill="#475569">COMPUTADOR / SERVIDOR LOCAL</text>
  <text x="745" y="90" font-size="10" fill="#64748b">CPU x86-64 · RAM do processo Python</text>
  <rect x="750" y="102" width="210" height="58" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="855" y="124" font-size="12" font-weight="bold" text-anchor="middle" fill="#3730a3">API FastAPI (Python)</text>
  <text x="855" y="142" font-size="10" text-anchor="middle" fill="#475569">cliente MQTT (paho) + HTTP</text>
  <rect x="750" y="180" width="210" height="62" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="855" y="202" font-size="12" font-weight="bold" text-anchor="middle" fill="#3730a3">Processamento</text>
  <text x="855" y="219" font-size="10" text-anchor="middle" fill="#475569">regras da fila (sem negativos,</text>
  <text x="855" y="233" font-size="10" text-anchor="middle" fill="#475569">sem duplicatas) + regressão linear</text>
  <rect x="750" y="262" width="210" height="58" rx="8" fill="#ecfeff" stroke="#0891b2"/>
  <text x="855" y="284" font-size="12" font-weight="bold" text-anchor="middle" fill="#155e75">SQLite (disco)</text>
  <text x="855" y="302" font-size="10" text-anchor="middle" fill="#475569">eventos com horário e origem</text>
  <line x1="855" y1="160" x2="855" y2="178" stroke="#475569" stroke-width="1.5" marker-end="url(#g)"/>
  <line x1="855" y1="242" x2="855" y2="260" stroke="#475569" stroke-width="1.5" marker-end="url(#g)"/>

  <line x1="640" y1="180" x2="728" y2="150" stroke="#dc0069" stroke-width="2" marker-end="url(#a)"/>
  <line x1="728" y1="160" x2="643" y2="225" stroke="#dc0069" stroke-width="2" marker-end="url(#a)"/>
  <text x="684" y="152" font-size="10" text-anchor="middle" fill="#475569">eventos</text>
  <text x="690" y="222" font-size="10" text-anchor="middle" fill="#475569">estado</text>

  <!-- Navegador -->
  <rect x="730" y="410" width="250" height="80" rx="10" fill="#fff7ed" stroke="#f97316"/>
  <text x="855" y="434" font-size="13" font-weight="bold" text-anchor="middle" fill="#9a3412">NAVEGADOR (dashboard)</text>
  <text x="855" y="454" font-size="11" text-anchor="middle" fill="#1f2937">fila · espera · concluídos · eventos</text>
  <text x="855" y="472" font-size="10" text-anchor="middle" fill="#64748b">HTML/CSS/JS · botões virtuais</text>
  <line x1="830" y1="372" x2="830" y2="407" stroke="#dc0069" stroke-width="2" marker-end="url(#a)"/>
  <line x1="880" y1="407" x2="880" y2="372" stroke="#dc0069" stroke-width="2" marker-end="url(#a)"/>
  <text x="900" y="394" font-size="10" fill="#475569">HTTP/JSON</text>
  <text x="742" y="394" font-size="10" fill="#475569">GET a cada 2 s</text>

  <!-- Fluxo -->
  <rect x="20" y="400" width="690" height="180" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="38" y="425" font-size="13" font-weight="bold" fill="#18233b">Fluxo de informações</text>
  <text x="38" y="450" font-size="11" fill="#1f2937">1. Entrada: o firmware lê os botões por polling (debounce de 350 ms).</text>
  <text x="38" y="472" font-size="11" fill="#1f2937">2. Processamento local: o ESP32 monta um JSON com event_id e o publica em …/events.</text>
  <text x="38" y="494" font-size="11" fill="#1f2937">3. Servidor: valida o evento, grava no SQLite e calcula a fila e as duas previsões.</text>
  <text x="38" y="516" font-size="11" fill="#1f2937">4. Saída local: a API publica o estado em …/state; o ESP32 atualiza OLED, LEDs e buzzer.</text>
  <text x="38" y="538" font-size="11" fill="#1f2937">5. Saída web: o navegador consulta /api/status por HTTP e mostra os dados.</text>
  <text x="38" y="562" font-size="10" fill="#64748b">Estado oficial da fila no servidor · eventos repetidos ignorados · dados de treino da IA simulados.</text>
</svg>
